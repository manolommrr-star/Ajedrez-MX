name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; los push nuevos cancelan el pendiente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias (app)
        working-directory: app
        run: npm ci

      - name: Smoke del dominio (cuentas, guardas, datos, cobros)
        working-directory: app
        run: npm test

      - name: Compilar la app Vue
        working-directory: app
        run: npm run build

      - name: Preparar sitio (compilación Vue en la raíz)
        shell: bash
        run: |
          mkdir -p staging
          cp -r app/dist/* staging/

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publicar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
